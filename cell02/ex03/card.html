<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <!-- Header ด้านบนการ์ด -->
        <h2>User Profile Card</h2>

        <!-- Invisible Table สำหรับจัดเรียงข้อมูล -->
        <table class="profile-table">
            <tr>
                <td>
                    <!-- รูปโปรไฟล์Unnamed.jpg ในโฟลเดอร์เดียวกัน -->
                    <img src="unnamed.jpg" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="login">Sirikorn yamket</td>
            </tr>
            <tr>
                <td class="description">Woonsen :)</td>
            </tr>
            <tr>
                <td class="socials">
                    <a href="https://www.instagram.com/mewoon_?stkn=MWFpb25hbTlvNmQwbg==" target="_blank">
                        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
                    </a>
                    <a href="#">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
                    </a>
                    <a href="#">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub">
                    </a>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
