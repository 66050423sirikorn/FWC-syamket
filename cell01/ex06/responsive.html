<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Responsive Table</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            padding: 20px;
            border: 1px solid black;
            font-family: Arial, sans-serif;
            font-size: 18px;
            vertical-align: middle;
            box-sizing: border-box;
        }

        .blue-box {
            background-color: lightblue;
        }

        .pink-box {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="blue-box">Watsons</td>
            <td class="pink-box">Boots</td>
        </tr>
    </table>

</body>
</html>
