<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Exercise</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- ภาพที่ 1 พร้อมข้อความตรงกลาง -->
    <div class="parallax img1">
        <div class="caption">
            <span>FIRST PARALLAX IMAGE</span>
        </div>
    </div>

    <!-- กล่องสีดำพร้อมข้อความ -->
    <div class="black-block">
        <h2>BLACK SECTION</h2>
        <p>This is a custom message inside the black block.</p>
    </div>

    <!-- ภาพที่ 2 พร้อมข้อความตรงกลาง -->
    <div class="parallax img2">
        <div class="caption">
            <span>SECOND PARALLAX IMAGE</span>
        </div>
    </div>

</body>
</html>
