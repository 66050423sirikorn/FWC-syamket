<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tab</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
        }

        table {
            width: 100%;
            height: 120px;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            padding: 10px;
            border: 1px solid black;
            font-family: Arial, sans-serif;
            font-size: 18px;
            vertical-align: middle;
        }

        .blue-box {
            background-color: lightblue;
        }

        .pink-box {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="blue-box">Watsons</td>
            <td class="pink-box">Boots</td>
        </tr>
    </table>

</body>
</html>
